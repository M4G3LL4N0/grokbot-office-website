name: Bug report
description: Report a broken or misleading website behavior.
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the route, viewport, and steps. Do not include secrets or private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
